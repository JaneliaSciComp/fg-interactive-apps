name: JupyterLab
description: Run a JupyterLab notebook server on a cluster node, via Apptainer.
requirements:
    - apptainer

runnables:
    - id: serve
      name: Server
      type: service
      description: >-
          Start a JupyterLab server (SciPy stack) and open it in your browser.
          Runs until you stop it.
      # Fileglancer publishes the service URL once the port is live (auto_url) and
      # embeds the token it minted ($FG_SERVICE_TOKEN) via service_url_suffix
      # (/lab?token=...), so "Open Service" logs in with one click. The same
      # token is enforced on the server via the JUPYTER_TOKEN environment
      # variable (jupyter_server's IdentityProvider reads it natively), rather
      # than a CLI flag, so it never appears in the process's argv (visible to
      # other users via `ps` on a shared node). Fileglancer appends `command:`
      # directly to `apptainer exec` with no shell of its own, so this uses an
      # explicit `sh -c '...' _`: the single quotes keep the host job script
      # from expanding $FG_SERVICE_TOKEN (it's expanded inside the container
      # instead, from the environment Apptainer passes through by default),
      # and the trailing `_` occupies $0 so appended `parameters:` land in
      # "$@" and get forwarded. `exec` keeps the server a direct child of the
      # job script.
      auto_url: true
      service_url_suffix: "/lab?token=${FG_SERVICE_TOKEN}"
      container: docker://quay.io/jupyter/scipy-notebook:latest
      command: >-
          sh -c 'export JUPYTER_TOKEN="$FG_SERVICE_TOKEN";
          exec jupyter lab --no-browser --ip=0.0.0.0 --port="$FG_SERVICE_PORT" "$@"' _
      parameters:
          - flag: --ServerApp.root_dir
            name: Working Directory
            type: directory
            description: >-
                Directory JupyterLab opens in. Must be within a mounted file share; it
                is bind-mounted into the container automatically. Defaults to your home
                directory.
            required: false
            exists: true
            default: "~"

      resources:
          cpus: 2
          memory: "16 GB"
          walltime: "08:00"
