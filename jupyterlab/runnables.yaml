name: JupyterLab
description: Run a JupyterLab notebook server on a cluster node, via Apptainer.
requirements:
    - apptainer

runnables:
    - id: serve
      name: Server
      type: service
      description: >-
          Start a JupyterLab server (SciPy stack) and open it in your browser.
          Runs until you stop it.
      # Fileglancer publishes the service URL once the port is live (auto_url) and
      # embeds the token it minted ($FG_SERVICE_TOKEN) via service_url_suffix
      # (/lab?token=...), so "Open Service" logs in with one click. The same
      # token is enforced on the server via JUPYTER_TOKEN_FILE, which
      # jupyter_server's IdentityProvider reads natively: the token is written
      # to a private (mode 0600) temp file that is opened on fd 3 and unlinked
      # before the server starts, and the server reads it as /dev/fd/3. It
      # therefore never appears in the process's argv (visible to other users
      # via `ps` on a shared node) and no token file outlives the process.
      # FG_SERVICE_TOKEN is unset before exec so the kernels and terminals
      # Jupyter spawns don't inherit it (unlike JUPYTER_TOKEN, JUPYTER_TOKEN_FILE
      # only names a path). Fileglancer appends `command:` directly to `apptainer exec` with no
      # shell of its own, so this uses an explicit `sh -c '...' _`: the single
      # quotes keep the host job script from expanding $FG_SERVICE_TOKEN (that
      # happens inside the container instead), and the trailing `_` occupies
      # $0 so appended `parameters:` land in "$@" and get forwarded. `exec`
      # keeps the server a direct child of the job script.
      auto_url: true
      service_url_suffix: "/lab?token=${FG_SERVICE_TOKEN}"
      container: docker://quay.io/jupyter/scipy-notebook:latest
      command: >-
          sh -c 'F=$(mktemp) || exit 1;
          printf %s "$FG_SERVICE_TOKEN" > "$F";
          exec 3<"$F"; rm -f "$F"; unset FG_SERVICE_TOKEN;
          JUPYTER_TOKEN_FILE=/dev/fd/3 exec jupyter lab --no-browser --ip=0.0.0.0 --port="$FG_SERVICE_PORT" "$@"' _
      parameters:
          - flag: --ServerApp.root_dir
            name: Working Directory
            type: directory
            description: >-
                Directory JupyterLab opens in. Must be within a mounted file share; it
                is bind-mounted into the container automatically. Defaults to your home
                directory.
            required: false
            exists: true
            default: "~"

      resources:
          cpus: 2
          memory: "16 GB"
          walltime: "08:00"
