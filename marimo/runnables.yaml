name: marimo
description: Run a marimo reactive Python notebook server on a cluster node, via Apptainer.
requirements:
    - apptainer

runnables:
    - id: serve
      name: Server
      type: service
      description: >-
          Start a marimo reactive notebook editor and open it in your browser.
          Runs until you stop it.
      # Fileglancer publishes the service URL once the port is live (auto_url) and
      # embeds the token it minted ($FG_SERVICE_TOKEN) via service_url_suffix, so
      # "Open Service" logs in with one click. marimo accepts the token in the
      # URL as ?access_token=<token>. On the server side, the token is written
      # to a private (mode 0600) temp file that is opened on fd 3 and unlinked
      # before the server starts; marimo reads it as /dev/fd/3 via
      # --token-password-file rather than --token-password, so it never appears
      # in the process's argv (visible to other users via `ps` on a shared node)
      # and no token file outlives the process. Fileglancer appends `command:`
      # directly to `apptainer exec` with no shell of its own, so this uses an
      # explicit `sh -c '...' _`: the single quotes keep the host job script
      # from expanding $FG_SERVICE_TOKEN (that happens inside the container
      # instead), and the trailing `_` occupies $0 so appended `parameters:`
      # land in "$@" and get forwarded.
      auto_url: true
      service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
      container: docker://ghcr.io/marimo-team/marimo:latest-sql
      command: >-
          sh -c 'F=$(mktemp) || exit 1;
          printf %s "$FG_SERVICE_TOKEN" > "$F";
          exec 3<"$F"; rm -f "$F";
          exec marimo edit --headless --host 0.0.0.0 --port "$FG_SERVICE_PORT" --token-password-file /dev/fd/3 "$@"' _
      parameters:
          - name: Notebook or Folder
            type: directory
            description: >-
                Notebook file or directory to open in marimo. Must be within a mounted
                file share; it is bind-mounted into the container automatically.
                Defaults to your home directory.
            required: false
            exists: true
            default: "~"

      resources:
          cpus: 2
          memory: "8 GB"
          walltime: "08:00"
