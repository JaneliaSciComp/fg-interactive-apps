name: OpenVSCode
description: Run a browser-based VS Code IDE (openvscode-server) on a cluster node, via Apptainer.
# openvscode-server is pulled and run entirely inside an Apptainer container, so
# the only host requirement is Apptainer itself. The container is cached per-user
# under ~/.fileglancer/apptainer_cache on first launch and reused afterwards.
requirements:
    - apptainer

runnables:
    - id: serve
      name: Server
      type: service
      description: >-
          Start a VS Code (openvscode-server) instance and open it in your browser.
          Runs until you stop it.
      # Fileglancer publishes the service URL once the port is live (auto_url) and
      # embeds the connection token it minted ($FG_SERVICE_TOKEN) via
      # service_url_suffix (?tkn=...), so "Open Service" authenticates in a
      # single click. The same token is written to a private (mode 0600) temp
      # file that is opened on fd 3 and unlinked before the server starts; the
      # server reads it as /dev/fd/3 via --connection-token-file rather than
      # --connection-token, so it never appears in the process's argv (visible
      # to other users via `ps` on a shared node) and no token file outlives
      # the process. FG_SERVICE_TOKEN is unset before exec so the terminals
      # and extension hosts the IDE spawns don't inherit it. Fileglancer appends `command:` directly to `apptainer exec`
      # with no shell of its own, so this uses an explicit `sh -c '...' _`: the
      # single quotes keep the host job script from expanding $FG_SERVICE_TOKEN
      # (that happens inside the container instead), and the trailing `_`
      # occupies $0 so appended `parameters:` land in "$@" and get forwarded.
      auto_url: true
      service_url_suffix: "/?tkn=${FG_SERVICE_TOKEN}"
      container: docker://gitpod/openvscode-server:latest
      command: >-
          sh -c 'F=$(mktemp) || exit 1;
          printf %s "$FG_SERVICE_TOKEN" > "$F";
          exec 3<"$F"; rm -f "$F"; unset FG_SERVICE_TOKEN;
          exec /home/.openvscode-server/bin/openvscode-server --host 0.0.0.0 --port "$FG_SERVICE_PORT" --connection-token-file /dev/fd/3 --user-data-dir "$HOME/.openvscode-server/data" --extensions-dir "$HOME/.openvscode-server/extensions" "$@"' _
      parameters:
          - flag: --default-folder
            name: Folder
            type: directory
            description: >-
                Folder to open in VS Code (optional). Must be within a mounted file
                share; it is bind-mounted into the container automatically.
            required: false
            exists: true

      resources:
          cpus: 2
          memory: "8 GB"
          walltime: "08:00"
